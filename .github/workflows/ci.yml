name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Point at the service container; tests create/drop their own throwaway
      # databases (28 of the 78 test files are DB/RLS-backed).
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-test-anon-key
      IMP_SECRET: ci-test-impersonation-secret-0123456789abcdef0123456789abcdef
      AUDIT_SALT: ci-test-audit-salt
      SAMPLE_OCR: '0'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Node 22 has prebuilt binaries for better-sqlite3 and @next/swc on
      # linux-x64. Do NOT use --ignore-scripts (that is a local Node 25 workaround).
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verify migration chain
        run: npm run db:migrate

      - name: Test
        run: npm test

      # Materialise fake, secret-shaped values so verify:secrets checks for
      # real canary strings instead of only the variable-name literal.
      # Shell env vars above still take precedence during build.
      - name: Seed canary env for bundle scan
        run: |
          printf '%s\n' \
            'SUPABASE_SERVICE_ROLE_KEY=ci-canary-service-role-key-not-real' \
            'SUPABASE_DB_URL=postgresql://ci:ci@127.0.0.1:5432/ci' \
            'GEMINI_API_KEY=ci-canary-gemini-key-not-real' > .env.local

      - name: Build
        run: npm run build

      - name: Verify no secrets in bundle
        run: npm run verify:secrets
